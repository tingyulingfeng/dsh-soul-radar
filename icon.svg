<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A radar sweep with a small fish inside it">
  <title>Emotion radar</title>
  <rect width="64" height="64" rx="14" fill="#0d1b2a"/>
  <!-- radar rings -->
  <g fill="none" stroke="#3f8ecb" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="32" cy="34" r="18"/>
    <circle cx="32" cy="34" r="11"/>
    <circle cx="32" cy="34" r="4.5"/>
  </g>
  <!-- sweep -->
  <path d="M32 34 L32 16 A18 18 0 0 1 47.6 25 Z" fill="#3f8ecb" fill-opacity="0.28"/>
  <line x1="32" y1="34" x2="32" y2="16" stroke="#8fd0ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- the reader, a small fish -->
  <path d="M20 40 q6 -6 12 0 q-6 6 -12 0 Z" fill="#ffd79a"/>
  <path d="M20 40 l-4 -3 l0 6 Z" fill="#ffd79a"/>
  <circle cx="29" cy="39" r="1.15" fill="#0d1b2a"/>
  <!-- blip -->
  <circle cx="43" cy="44" r="2.4" fill="#ff8f6b"/>
</svg>
